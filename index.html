<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>FERMA AKK OLX — Панель управления</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #161b22; padding: 20px; border-radius: 8px; border: 1px solid #30363d; }
        h1 { color: #58a6ff; font-size: 22px; margin-top: 0; }
        button { background: #238636; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2ea043; }
        button:disabled { background: #484f58; cursor: not-allowed; }
        .status-box { background: #21262d; padding: 12px; border-radius: 6px; margin: 15px 0; border: 1px solid #30363d; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #30363d; }
        th { color: #8b949e; }
    </style>
</head>
<body>
    <div class="container">
        <h1>FERMA AKK OLX Dashboard</h1>
        <div class="status-box">
            <p><strong>Статус бота:</strong> <span id="status-text">Загрузка...</span></p>
            <p><strong>Последний лог:</strong> <span id="log-text">-</span></p>
            <button id="start-btn" onclick="startBot()">Запустить воркер</button>
        </div>

        <h2>Успешные аккаунты</h2>
        <table>
            <thead>
                <tr>
                    <th>Номер телефона</th>
                    <th>Код</th>
                    <th>Время</th>
                </tr>
            </thead>
            <tbody id="accounts-table">
                <tr><td colspan="3">Загрузка данных...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        async function fetchStatus() {
            try {
                let res = await fetch('/api/status');
                let data = await res.json();
                document.getElementById('status-text').innerText = data.running ? "🔄 Работает..." "⏸ Остановлен";
                document.getElementById('log-text').innerText = data.last_log;
                document.getElementById('start-btn').disabled = data.running;
            } catch (e) {
                console.error(e);
            }
        }

        async function fetchAccounts() {
            try {
                let res = await fetch('/api/accounts');
                let data = await res.json();
                let tbody = document.getElementById('accounts-table');
                if (data.success && data.accounts.length > 0) {
                    tbody.innerHTML = data.accounts.map(acc => `
                        <tr>
                            <td>${acc.phone}</td>
                            <td>${acc.code || '-'}</td>
                            <td>${new Date(acc.time * 1000).toLocaleString()}</td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = `<tr><td colspan="3">Нет сохраненных аккаунтов</td></tr>`;
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function startBot() {
            let res = await fetch('/api/start', { method: 'POST', headers: {'Content-Type': 'application/json'} });
            let data = await res.json();
            alert(data.message);
            fetchStatus();
        }

        setInterval(() => {
            fetchStatus();
            fetchAccounts();
        }, 3000);

        fetchStatus();
        fetchAccounts();
    </script>
</body>
</html>
